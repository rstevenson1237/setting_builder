# The four commands a session runs before closing a milestone, run again on
# every push and pull request. Nothing here is a check of its own: CI runs what
# CLAUDE.md already tells a developer to run, so the two cannot drift.
name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # SPEC.md section 13: Python 3.11 or later, standard library plus pyyaml.
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pyyaml
        run: python -m pip install --upgrade pip pyyaml

      # The cheap structural checks run first, so a stale index or a broken
      # pattern fails in seconds rather than after the suite.
      - name: Router index is current
        run: python tools/router.py --check

      - name: Patterns resolve and the genre is within its cap
        run: python tools/resolve_deps.py --check

      - name: Mechanical checks
        run: python tools/validate.py

      - name: Tests
        run: python -m unittest discover -s tests --verbose
