name: Validate setting content

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    name: Validate templates, connections, and registries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run structural validator
        run: python3 tools/validate_setting.py

      - name: Check the site and PDF show everything the schema and setting hold
        run: |
          python3 tools/build_site.py --out /tmp/site --check
          python3 tools/build_pdf.py --check
