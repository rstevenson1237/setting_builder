name: Validate setting content

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    name: Validate templates, connections, and registries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/cache@v4      # renders and artgen reads, keyed by what they were made from
        with:
          path: .maps-cache
          key: maps-${{ hashFiles('setting/**', 'tools/*.py', 'tools/artgen/VERSION') }}
          restore-keys: maps-

      - name: Check artgen runs and reports its formats
        run: node tools/artgen/artgen-maps.js formats --json

      - name: Run structural validator
        run: python3 tools/validate_setting.py

      - name: Check the site and PDF show everything the schema and setting hold
        run: |
          python3 tools/build_site.py --out /tmp/site --check
          python3 tools/build_pdf.py --check
